<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tarteel Live — سورة الإخلاص</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262a33;
    --text: #e8e6e1;
    --muted: #8b8f98;
    --green: #3ecf6e;
    --red: #e2564f;
    --yellow: #e2b23c;
    --orange: #e08a2c;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 20px;
    letter-spacing: 0.5px;
  }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    font-size: 14px;
    color: var(--muted);
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .dot.speaking {
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
  }
  .dot.silence {
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
  }
  .dot.idle { background: var(--muted); box-shadow: none; }

  .surah-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 720px;
    width: 100%;
    font-size: 34px;
    line-height: 2.6;
    text-align: center;
  }
  .word {
    display: inline-block;
    margin: 0 6px;
    padding: 2px 4px;
    border-radius: 6px;
    transition: color 0.2s ease, background 0.2s ease;
    color: var(--muted);
  }
  .word.correct { color: var(--green); }
  .word.wrong { color: var(--red); background: rgba(226,86,79,0.12); }
  .word.missed { color: var(--orange); background: rgba(224,148,60,0.12); }
  .word.pending { color: #55585f; }
  .word.current {
    background: rgba(226,178,60,0.18);
    box-shadow: inset 0 0 0 1px var(--yellow);
  }
  .ayah-break { display: block; height: 6px; }

  .controls {
    max-width: 720px;
    width: 100%;
    margin-top: 26px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .row label {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }
  .row .val { font-size: 13px; color: var(--text); min-width: 54px; text-align: left; direction: ltr;}
  input[type=range] {
    flex: 1;
    accent-color: var(--accent);
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; direction: ltr; }

  .raw-text {
    margin-top: 14px;
    font-size: 15px;
    color: var(--muted);
    min-height: 22px;
    direction: rtl;
  }
  .matched-text {
    color: var(--accent);
    font-weight: 600;
    margin-top: 4px;
  }
  .conn-state { font-size: 12px; color: var(--muted); direction: ltr; }
  .chunk-log { max-width: 720px; width: 100%; margin-top: 18px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; direction: ltr; text-align: left; }
  .chunk-log h2 { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
  .chunk-rows { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .chunk-row { padding: 7px 9px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .chunk-meta { color: var(--muted); margin-right: 8px; }
  .chunk-text { color: var(--text); direction: rtl; text-align: right; display: inline-block; }
  .chunk-silence .chunk-text { color: var(--muted); }
</style>
</head>
<body>

  <h1>Tarteel Live — تلاوة سورة الإخلاص (112)</h1>

  <div class="status-bar">
    <div class="dot idle" id="statusDot"></div>
    <span id="statusText">غير متصل</span>
    <span class="conn-state" id="connState"></span>
  </div>

  <div class="surah-card" id="surahCard">
    جارٍ التحميل...
  </div>

  <div class="raw-text" id="rawText"></div>
  <div class="raw-text matched-text" id="matchedText"></div>

  <section class="chunk-log" aria-label="Live chunk results">
    <h2>Live chunk results — 1 second · audio saved for review</h2>
    <div class="chunk-rows" id="chunkRows"></div>
  </section>

  <div class="controls">
    <div class="row">
      <label for="chunkSize">حجم المقطع الصوتي (Chunk size)</label>
      <input type="range" id="chunkSize" min="1000" max="3000" step="100" value="1000" />
      <span class="val" id="chunkSizeVal">1000 ms</span>
    </div>
    <div class="row">
      <label for="vadThreshold">حساسية كشف الصوت (VAD threshold)</label>
      <input type="range" id="vadThreshold" min="50" max="1000" step="10" value="250" />
      <span class="val" id="vadThresholdVal">250</span>
    </div>
    <div class="row btn-row">
      <button id="startBtn">ابدأ التلاوة (Start)</button>
      <button id="stopBtn" class="secondary" disabled>إيقاف (Stop)</button>
      <button id="resetBtn" class="secondary">إعادة تعيين (Reset)</button>
    </div>
  </div>

<script>
const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";

let ws = null;
let audioCtx = null;
let mediaStream = null;
let sourceNode = null;
let processorNode = null;
let pcmBuffer = [];       // accumulates Float32 samples at 16kHz until chunk boundary
let chunkSamples = 0;     // recomputed from chunkSize slider
let running = false;
let chunkNumber = 0;

const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const connState = document.getElementById('connState');
const surahCard = document.getElementById('surahCard');
const rawText = document.getElementById('rawText');
const matchedText = document.getElementById('matchedText');
const chunkRows = document.getElementById('chunkRows');
const chunkSizeSlider = document.getElementById('chunkSize');
const chunkSizeVal = document.getElementById('chunkSizeVal');
const vadSlider = document.getElementById('vadThreshold');
const vadVal = document.getElementById('vadThresholdVal');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const resetBtn = document.getElementById('resetBtn');

const TARGET_SAMPLE_RATE = 16000;

// We prepend a small TAIL of the previous chunk (not the whole chunk) to
// the next one before sending, so a word cut at the boundary is fully
// present in the next chunk too. Keeping this short (instead of the entire
// previous chunk) matters for two reasons: (1) it limits how much repeated
// audio Whisper sees per chunk, which was pushing this Quran-tuned model
// toward "auto-completing" memorized ayah text instead of just transcribing
// what was actually said, and (2) the backend now diffs consecutive
// transcripts against each other (see diff_new_words in main.py) to avoid
// double-counting words that appear in two overlapping chunks - a shorter,
// fixed-size overlap makes that diff cleaner and cheaper.
const OVERLAP_MS = 400;
let previousChunk = [];  // tail of the previous chunk's samples, kept for prepending

function computeChunkSamples() {
  const ms = parseInt(chunkSizeSlider.value, 10);
  chunkSamples = Math.round(TARGET_SAMPLE_RATE * (ms / 1000));
}
computeChunkSamples();

chunkSizeSlider.addEventListener('input', () => {
  chunkSizeVal.textContent = chunkSizeSlider.value + ' ms';
  computeChunkSamples();
});

vadSlider.addEventListener('input', () => {
  vadVal.textContent = vadSlider.value;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'set_vad_threshold', value: parseFloat(vadSlider.value) }));
  }
});

// ---- Fetch reference words and render placeholders ----
async function loadReference() {
  const res = await fetch('/reference');
  const data = await res.json();
  renderWords(data.words.map(w => ({ text: w.text, ayah: w.ayah, status: 'pending' })));
}

function renderWords(words) {
  surahCard.innerHTML = '';
  let lastAyah = -1;
  words.forEach((w, i) => {
    if (w.ayah !== lastAyah && lastAyah !== -1) {
      surahCard.appendChild(document.createElement('span')).className = 'ayah-break';
    }
    lastAyah = w.ayah;
    const span = document.createElement('span');
    span.className = 'word ' + (w.status || 'pending');
    span.textContent = w.text;
    span.dataset.index = i;
    surahCard.appendChild(span);
  });
}

function updateWords(words, cursor) {
  const spans = surahCard.querySelectorAll('.word');
  words.forEach((w, i) => {
    const span = spans[i];
    if (!span) return;
    span.className = 'word ' + w.status + (i === cursor ? ' current' : '');
  });
}

function appendChunkResult(data) {
  chunkNumber += 1;
  const row = document.createElement('div');
  row.className = 'chunk-row' + (data.speaking ? '' : ' chunk-silence');
  const text = data.raw_text || '(silence / no speech)';
  row.innerHTML = `<span class="chunk-meta">#${chunkNumber} · ${data.speaking ? 'speech' : 'silence'}</span><span class="chunk-text"></span>`;
  row.querySelector('.chunk-text').textContent = text;
  chunkRows.appendChild(row);
  while (chunkRows.children.length > 60) chunkRows.removeChild(chunkRows.firstChild);
  chunkRows.scrollTop = chunkRows.scrollHeight;
}

// ---- WebSocket ----
function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    connState.textContent = '(connected)';
  };
  ws.onclose = () => {
    connState.textContent = '(disconnected)';
    setSpeakingState('idle');
  };
  ws.onerror = () => {
    connState.textContent = '(error)';
  };
  ws.onmessage = (evt) => {
    const data = JSON.parse(evt.data);
    if (data.type === 'update') {
      appendChunkResult(data);
      setSpeakingState(data.speaking ? 'speaking' : 'silence');
      updateWords(data.words, data.cursor);
      rawText.textContent = data.raw_text ? ('يسمع (raw): ' + data.raw_text) : '';
      matchedText.textContent = (data.matched_words && data.matched_words.length)
        ? ('matched (new): ' + data.matched_words.join(' '))
        : '';
      if (data.done) {
        statusText.textContent = 'أحسنت! تمت قراءة سورة الإخلاص ✅';
      }
    }
  };
}

function setSpeakingState(state) {
  statusDot.classList.remove('speaking', 'silence', 'idle');
  statusDot.classList.add(state);
  if (state === 'speaking') statusText.textContent = 'يتحدث...';
  else if (state === 'silence') statusText.textContent = 'صمت';
  else statusText.textContent = 'غير متصل';
}

// ---- Microphone capture -> resample to 16kHz PCM16 -> send chunks ----
async function startMic() {
  mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1 } });
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  sourceNode = audioCtx.createMediaStreamSource(mediaStream);

  // ScriptProcessorNode is deprecated but universally supported and simplest
  // for this use case; buffer size 4096 gives a good latency/CPU balance.
  processorNode = audioCtx.createScriptProcessor(4096, 1, 1);

  const nativeSampleRate = audioCtx.sampleRate;

  processorNode.onaudioprocess = (e) => {
    if (!running) return;
    const input = e.inputBuffer.getChannelData(0);
    const resampled = downsampleBuffer(input, nativeSampleRate, TARGET_SAMPLE_RATE);
    for (let i = 0; i < resampled.length; i++) {
      pcmBuffer.push(resampled[i]);
    }
    while (pcmBuffer.length >= chunkSamples) {
      // Pull out exactly one new chunk's worth of fresh audio.
      const newChunk = pcmBuffer.slice(0, chunkSamples);
      pcmBuffer = pcmBuffer.slice(chunkSamples);

      // Send [previous full chunk] + [this new chunk] together, so Whisper
      // always sees the entire prior chunk as left-context. Any word that
      // was cut off at the previous boundary is now fully contained.
      const combined = previousChunk.length
        ? previousChunk.concat(newChunk)
        : newChunk;
      sendChunk(combined);

      // Only keep the last OVERLAP_MS worth of this chunk as the tail for
      // next time - not the whole chunk.
      const overlapSamples = Math.round(TARGET_SAMPLE_RATE * (OVERLAP_MS / 1000));
      previousChunk = newChunk.slice(Math.max(0, newChunk.length - overlapSamples));
    }
  };

  sourceNode.connect(processorNode);
  processorNode.connect(audioCtx.destination);
}

function downsampleBuffer(buffer, inRate, outRate) {
  if (outRate === inRate) return buffer;
  const ratio = inRate / outRate;
  const newLen = Math.round(buffer.length / ratio);
  const result = new Float32Array(newLen);
  let offsetResult = 0;
  let offsetBuffer = 0;
  while (offsetResult < newLen) {
    const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
    let accum = 0, count = 0;
    for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
      accum += buffer[i];
      count++;
    }
    result[offsetResult] = count > 0 ? accum / count : 0;
    offsetResult++;
    offsetBuffer = nextOffsetBuffer;
  }
  return result;
}

function sendChunk(floatSamples) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const pcm16 = new Int16Array(floatSamples.length);
  for (let i = 0; i < floatSamples.length; i++) {
    let s = Math.max(-1, Math.min(1, floatSamples[i]));
    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  ws.send(pcm16.buffer);
}

function stopMic() {
  if (processorNode) processorNode.disconnect();
  if (sourceNode) sourceNode.disconnect();
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  pcmBuffer = [];
  previousChunk = [];
}

// ---- Buttons ----
startBtn.addEventListener('click', async () => {
  try {
    if (!ws || ws.readyState !== WebSocket.OPEN) connectWS();
    await startMic();
    running = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    setSpeakingState('silence');
  } catch (err) {
    alert('تعذر الوصول إلى الميكروفون: ' + err.message);
  }
});

stopBtn.addEventListener('click', () => {
  running = false;
  stopMic();
  startBtn.disabled = false;
  stopBtn.disabled = true;
  setSpeakingState('idle');
});

resetBtn.addEventListener('click', () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'reset' }));
  }
  previousChunk = [];
  chunkNumber = 0;
  chunkRows.innerHTML = '';
  loadReference();
  rawText.textContent = '';
  matchedText.textContent = '';
  statusText.textContent = running ? 'صمت' : 'غير متصل';
});

// init
loadReference();
connectWS();
</script>
</body>
</html>
